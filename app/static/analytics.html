<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Purchase Intelligence — Purchase patterns</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      __NAV__
      <main id="main-content" class="app-main">
      <header class="page-heading"><div>
        <p class="eyebrow">Deterministic patterns</p>
        <h1>Purchase patterns</h1>
        <p class="lede">Counts describe confirmed purchase history. They are not predictions and do not show what is still in the household.</p>
      </div><a class="button-link button-secondary" href="/ask">Ask AI about your history</a></header>
      <div id="analytics-status" class="result" role="status" aria-live="polite"></div>
      <section id="summary-section" hidden>
        <h2>Summary</h2>
        <div id="summary-grid" class="stat-grid"></div>
      </section>
      <section id="repeat-section" hidden>
        <h2>Items</h2>
        <div id="repeat-list" class="pattern-list"></div>
      </section>
      <section id="merchant-section" hidden>
        <h2>Merchants</h2>
        <div id="merchant-list" class="pattern-list"></div>
      </section>
      <section id="classification-section" hidden>
        <h2>Classifications</h2>
        <div id="classification-list" class="stat-grid"></div>
      </section>
      </main>
    </div>
    <script src="/static/analytics.js"></script>
  </body>
</html>
