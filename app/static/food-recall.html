<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Purchase Intelligence — Food you purchased</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">Purchase Intelligence</p>
      <p class="nav"><a href="/">Receipt intake</a> <a href="/memory">Purchase history</a></p>
      <h1>Food you purchased</h1>
      <p class="lede">
        Recent Walmart food purchases from purchase history. A picture shows a
        food that was purchased. It does not mean that food is still in the household.
      </p>
      <nav class="filters" aria-label="Food recall filters">
        <a href="/food-recall">All Walmart food</a>
        <a href="/food-recall?view=exact">Exact image</a>
        <a href="/food-recall?view=representative">Representative image</a>
        <a href="/food-recall?view=none">No image</a>
      </nav>
      <div id="recall-status" class="result" role="status" aria-live="polite"></div>
      <section id="recall-list" class="pattern-list"></section>
    </main>
    <script src="/static/food-recall.js"></script>
  </body>
